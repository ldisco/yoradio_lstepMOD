# Шаблон nginx: HTTP :80 — прокси TrackFacts для ESP (Gemini + Groq)
# yoRadio lstepMOD → tools/test_proxy_esp/deploy/
# Прошивка: https://github.com/ldisco/yoradio_lstepMOD (не стоковый upstream yoRadio)
# Не трогать :443 / xray / VPN-панели. Бэкапы не класть в sites-enabled/.
# server_name — подставьте свои домены или оставьте _.

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /gemini {
        resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
        resolver_timeout 5s;
        proxy_pass https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name generativelanguage.googleapis.com;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_connect_timeout 20s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_request_buffering on;
    }

    location = /groq {
        resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
        resolver_timeout 5s;
        proxy_pass https://api.groq.com/openai/v1/chat/completions;
        proxy_ssl_server_name on;
        proxy_ssl_name api.groq.com;
        proxy_set_header Host api.groq.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_connect_timeout 20s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_request_buffering on;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
