; yoRadio lstepMOD — smoke-test VPS-прокси TrackFacts (Gemini + Groq)
; Репозиторий: https://github.com/ldisco/yoradio_lstepMOD (форк, не стоковый yoRadio)
; Папка: tools/test_proxy_esp — отдельный мини-проект, основную прошивку не трогает.
; Сборка из корня репозитория:
;   pio run -d tools/test_proxy_esp -e test-proxy-esp
; Или из этой папки:
;   pio run -e test-proxy-esp -t upload

[env:test-proxy-esp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32s3devkitc1_n16r8
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.sdkconfig_options =
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

upload_resetmethod = esp32r0
build_type = release
lib_archive = no

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_RUNNING_CORE=1
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_SUPPORT=1
  ; UART (CH343 и т.п.), не native USB CDC — как yoRadio DevKit S3
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
upload_protocol = esptool
; COM-порт задайте свой: upload_port / monitor_port или pio run -t upload --upload-port COMx

lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
