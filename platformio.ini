; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Профиль железа = выбранный env + свой src/myoptions.h.
; В репозитории лежит пример myoptions для Faster (JC3248W535) —
; сборка: pio run -e yoradio-jc3248w535. Остальные платы —
; собрать конфиг на lstep.site/myoptions или по myoptions_universal.h.

[env:yoradio-esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32s3devkitc1_n16r8
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Стек loopTask (setup/loop + NETSERVER_LOOP1 на core 1). Через -D в build_flags НЕ работает:
; sdkconfig.h платформы снова ставит 8192 → warning "redefined" и фактически остаётся 8K.
board_build.sdkconfig_options =
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

upload_resetmethod = esp32r0
build_type = release
lib_archive = no
; Локальная SD (SD/) с sdcard_read_cid() — отпечаток физической карты в sdmanager.
lib_extra_dirs = SD

;platform_packages =
;    tool-mklittlefs4 @ https://github.com/pioarduino/registry/releases/download/0.0.1/mklittlefs-4.0.2.zip

build_flags =
  ; CORE_DEBUG_LEVEL=3 (INFO). Меньше шума Serial: поставить 2 (WARN). ##[BOOT]# идёт через Serial.print и виден всегда.
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1 
  -DARDUINO_RUNNING_CORE=1
  ; AUDIOTASK_CORE: не вызывать setAudioTaskCore(0) — декодер на Core 0 давал IDLE0 TWDT / reboot.
  ; Штатно декодер на Core 1 (Audio::m_audioTaskCoreId=1). Флаг ниже исторический, не переносить на Core 0.
  -DAUDIOTASK_CORE=0
  -DAUDIOCONTROLTASK_PRIO=15
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_SUPPORT=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DWS_MAX_QUEUED_MESSAGES=128
  -DCONFIG_ASYNC_TCP_QUEUE_LEN=64
  -DCONFIG_ASYNC_TCP_PRIORITY=10
  ; FreeRTOS run-time stats — загрузка CPU в WebUI (WEBUI_CPU_BAR_ENABLE).
  -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
  -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
  -DCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=1
  ; DLNA включается в src/myoptions.h, не здесь.
  ; USB/UART: UART (CP2102/CH340) → CDC_ON_BOOT=0; native USB ESP32-S3 → MODE=1 и CDC_ON_BOOT=1.

  ; [DevKit S3 через UART / CP2102 → COM]: Serial и ##[BOOT]#/IP на этом порту
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0

  ; [Native USB CDC]: раскомментируйте вместо пары выше
  ; -DARDUINO_USB_MODE=1      ; 0 - OTG, 1 - JTAG+CDC
  ; -DARDUINO_USB_CDC_ON_BOOT=1 ; 1 - Serial в native USB, не в UART COM
  
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  ; RX Wi-Fi под TCP window патченого lwIP (32 КБ): wrap → wifi_rx_buffers.cpp.
  ; Нужен в каждом env (build_flags не наследуются).
  -Wl,--wrap=esp_wifi_init
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio

monitor_speed = 115200
;monitor_filters = esp32_exception_decoder, log2file, time
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

upload_protocol = esptool

; Кириллица 5×7: tools/patch_glcdfont.py ← src/fonts/glcdfont.c
; Тяжёлый FLAC: tools/patch_audio_fix_libs.py ← tools/audio_fix_libs/<mcu>/
extra_scripts =
	post:tools/patch_glcdfont.py
	post:tools/patch_audio_fix_libs.py

lib_deps =
	moononournation/GFX Library for Arduino @ ^1.6.5
	bblanchon/ArduinoJson @ ^7.2.1
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ILI9341
  bodmer/TJpg_Decoder @ ^1.0.6
  ; XPT2046: локальная копия src/src/XPT2046_Touchscreen (патч IRQ begin), не GitHub.

; ================================================================================================
; JC2432W328 + XH-S3E (N16R8): прошивка/лог через CH340 → UART0, не native USB CDC.
; myoptions: свой файл под эту плату (в репо пример — Faster / JC3248).
; Сборка / заливка: pio run -e yoradio-jc2432w328 [-t upload]
; ================================================================================================
[env:yoradio-jc2432w328]
extends = env:yoradio-esp32s3
; Serial Monitor: CH340 на UART0. Собирать этим env.
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; Если порт не находится сам: monitor_port = COM3
; Освободить GPIO19/20 от USB-Serial-JTAG (после ремапа S3 там TFT SCLK/MISO).
board_build.sdkconfig_options =
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG=n
  CONFIG_USJ_ENABLE_USB_SERIAL_JTAG=n
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DARDUINO_RUNNING_CORE=1
  -DAUDIOTASK_CORE=0
  -DAUDIOCONTROLTASK_PRIO=15
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_SUPPORT=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DWS_MAX_QUEUED_MESSAGES=128
  -DCONFIG_ASYNC_TCP_QUEUE_LEN=64
  -DCONFIG_ASYNC_TCP_PRIORITY=10
  -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
  -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
  -DCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=1
  ; DLNA — в src/myoptions.h.
  ; CH340 на плате → Serial = UART0
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  ; RX Wi-Fi wrap (см. базовый env) — нужен в каждом env.
  -Wl,--wrap=esp_wifi_init
  ; DevKit variant: GPIO48 = RGB LED (RMT). На JC2432 TFT_DC=48 — RGB нельзя.
  -DESP32_ARDUINO_NO_RGB_BUILTIN
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio

; ================================================================================================
; Guition JC3248W535 (Faster / AXS15231B): USB-C = native USB CDC (CH340 на плате нет).
; Serial / ##[BOOT]# → CDC COM; заливка обычно через тот же USB (иногда BOOT).
; Пример src/myoptions.h в репо как раз под этот профиль (Faster).
; Сборка: pio run -e yoradio-jc3248w535
; ================================================================================================
[env:yoradio-jc3248w535]
extends = env:yoradio-esp32s3
monitor_speed = 115200
; CDC после reboot перечисляется заново — при необходимости monitor_port = COMx
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DARDUINO_RUNNING_CORE=1
  -DAUDIOTASK_CORE=0
  -DAUDIOCONTROLTASK_PRIO=15
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_SUPPORT=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DWS_MAX_QUEUED_MESSAGES=128
  -DCONFIG_ASYNC_TCP_QUEUE_LEN=64
  -DCONFIG_ASYNC_TCP_PRIORITY=10
  -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
  -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
  -DCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=1
  ; Native USB: Serial = CDC
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  ; RX Wi-Fi wrap — нужен в каждом env.
  -Wl,--wrap=esp_wifi_init
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio

; ================================================================================================
; Guition ESP32-4848S040 (Supremus / ST7701 480×480 RGB): UART Serial (CDC_ON_BOOT=0).
; myoptions: свой под Supremus (в репо пример — Faster; конфиг — lstep.site/myoptions).
; Сборка: pio run -e yoradio-4848s040
; ================================================================================================
[env:yoradio-4848s040]
extends = env:yoradio-esp32s3
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DARDUINO_RUNNING_CORE=1
  -DAUDIOTASK_CORE=0
  -DAUDIOCONTROLTASK_PRIO=15
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_SUPPORT=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DWS_MAX_QUEUED_MESSAGES=128
  -DCONFIG_ASYNC_TCP_QUEUE_LEN=64
  -DCONFIG_ASYNC_TCP_PRIORITY=10
  -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
  -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
  -DCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=1
  ; UART0 / CH340-стиль; не native CDC
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  ; RX Wi-Fi wrap — нужен в каждом env.
  -Wl,--wrap=esp_wifi_init
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio

; ================================================================================================
; ESP32-WROVER N16R8 (Aiwushka): classic ESP32 + PSRAM, не S3.
; Сборка / заливка: pio run -e yoradio-esp32-wrover [-t upload]
; Serial: UART (CP2102/CH340).
; Статус: доводка заморожена (не паритет S3); classic-фиксы в коде оставлены.
; FLAC: tools/audio_fix_libs/esp32/ через patch_audio_fix_libs.py.
; myoptions: свой (DSP_DUMMY / PCM5102 и т.п.); пример в репо — Faster.
; ================================================================================================
[env:yoradio-esp32-wrover]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32wrover_n16r8
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.sdkconfig_options =
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

upload_resetmethod = esp32r0
build_type = release
lib_archive = no
lib_extra_dirs = SD

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DARDUINO_RUNNING_CORE=1
  -DAUDIOTASK_CORE=0
  -DAUDIOCONTROLTASK_PRIO=15
  -DBOARD_HAS_PSRAM=1
  ; CONFIG_SPIRAM_SUPPORT не задаём вручную — уже в sdkconfig qio_qspi (иначе redefined warn)
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DWS_MAX_QUEUED_MESSAGES=128
  -DCONFIG_ASYNC_TCP_QUEUE_LEN=64
  -DCONFIG_ASYNC_TCP_PRIORITY=10
  -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
  -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
  -DCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=1
  ; Classic ESP32: Serial на UART0 / USB-UART мост
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  ; RX Wi-Fi wrap; lwIP classic — через patch_audio_fix_libs ниже.
  -Wl,--wrap=esp_wifi_init
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32/include/fatfs/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32/include/fatfs/vfs
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32/include/fatfs/diskio

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
upload_protocol = esptool

; glcdfont + FLAC TCP window (tools/audio_fix_libs/esp32/)
extra_scripts =
	post:tools/patch_glcdfont.py
	post:tools/patch_audio_fix_libs.py

lib_deps =
	moononournation/GFX Library for Arduino @ ^1.6.5
	bblanchon/ArduinoJson @ ^7.2.1
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ILI9341
  bodmer/TJpg_Decoder @ ^1.0.6
